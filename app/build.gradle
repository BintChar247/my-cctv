plugins { id 'com.android.application' }

android {
    namespace 'com.myhome.cctv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.myhome.cctv'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable without a Play Store key
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
