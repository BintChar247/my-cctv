name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.7' }
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/*.apk MyCCTV.apk
      - name: Publish APK as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" MyCCTV.apk --title "My CCTV (build ${{ github.run_number }})" --notes "Download MyCCTV.apk and open it on your phone to install." --latest
